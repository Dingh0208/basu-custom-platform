name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate release metadata
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $notes = "docs/RELEASE-NOTES-$env:RELEASE_TAG.md"
          if ("v$($package.version)" -ne $env:RELEASE_TAG) { throw "Tag $env:RELEASE_TAG does not match package version $($package.version)" }
          if (!(Test-Path -LiteralPath $notes)) { throw "Release notes not found: $notes" }

      - name: Install dependencies
        run: npm install

      - name: Download bundled FFmpeg
        shell: pwsh
        run: |
          $dir = "services/ffmpeg"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Invoke-WebRequest "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "$env:TEMP\ffmpeg.zip"
          Expand-Archive "$env:TEMP\ffmpeg.zip" "$env:TEMP\ffmpeg-extract" -Force
          $bin = Get-ChildItem "$env:TEMP\ffmpeg-extract" -Recurse -Filter ffmpeg.exe | Select-Object -First 1 -ExpandProperty DirectoryName
          Copy-Item (Join-Path $bin "ffmpeg.exe") (Join-Path $dir "ffmpeg.exe") -Force

      - name: Build frontend
        run: |
          python scripts/build-wechat-component.py
          git diff --exit-code -- electron/wechat-component.json
          if ($LASTEXITCODE -ne 0) { throw "Optional component checksum differs from the tagged source" }
          npm run build

      - name: Build Python sidecar
        shell: pwsh
        run: |
          pip install pyinstaller -r services/ai/requirements-dev.txt
          python scripts/generate-icon.py
          python -m unittest discover -s services/ai -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { throw "Sidecar regression tests failed" }
          powershell -ExecutionPolicy Bypass -File scripts/build-sidecar.ps1 -Python python
          if (Get-ChildItem release/ai-sidecar/clientatlas-ai -Recurse -Force -Filter .env) { throw "Refusing to package services/ai/.env into a release" }

      - name: Build web and offline installers
        shell: pwsh
        run: |
          npx electron-builder --win nsis-web --x64 --publish never
          if ($LASTEXITCODE -ne 0) { throw "Web installer packaging failed" }
          npx electron-builder --win nsis --x64 --prepackaged release/win-unpacked --publish never
          if ($LASTEXITCODE -ne 0) { throw "Offline installer packaging failed" }

      - name: Verify frozen runtime and bundled parsers
        run: |
          node scripts/verify-release.cjs
          if ($LASTEXITCODE -ne 0) { throw "Release metadata verification failed" }
          python scripts/verify-packaged-sidecar.py
          python scripts/verify-wechat-component.py

      - name: Publish complete release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = [regex]::Escape($env:RELEASE_TAG.TrimStart('v'))
          $assets = @((Get-ChildItem release,release/nsis-web -File | Where-Object { $_.Name -match "$version.*\.(exe|blockmap|nsis\.7z)$" }).FullName) + @((Get-Item release/latest.yml).FullName) + @((Get-Item "release/components/ClientAtlas-WeChat-Engine-$($env:RELEASE_TAG.TrimStart('v')).zip").FullName)
          gh release create $env:RELEASE_TAG @assets --draft --verify-tag --title "ClientAtlas $env:RELEASE_TAG" --notes-file "docs/RELEASE-NOTES-$env:RELEASE_TAG.md"
          if ($LASTEXITCODE -ne 0) { throw "Release upload failed" }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: clientatlas-setup
          path: release/*.exe
