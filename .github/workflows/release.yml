name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate release metadata
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $notes = "docs/RELEASE-NOTES-$env:RELEASE_TAG.md"
          if ("v$($package.version)" -ne $env:RELEASE_TAG) { throw "Tag $env:RELEASE_TAG does not match package version $($package.version)" }
          if (!(Test-Path -LiteralPath $notes)) { throw "Release notes not found: $notes" }

      - name: Install dependencies
        run: npm install

      - name: Download bundled FFmpeg
        shell: pwsh
        run: |
          $dir = "services/ffmpeg"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Invoke-WebRequest "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "$env:TEMP\ffmpeg.zip"
          Expand-Archive "$env:TEMP\ffmpeg.zip" "$env:TEMP\ffmpeg-extract" -Force
          $bin = Get-ChildItem "$env:TEMP\ffmpeg-extract" -Recurse -Filter ffmpeg.exe | Select-Object -First 1 -ExpandProperty DirectoryName
          Copy-Item (Join-Path $bin "ffmpeg.exe") (Join-Path $dir "ffmpeg.exe") -Force

      - name: Build frontend
        run: npm run build

      - name: Build Python sidecar
        shell: pwsh
        run: |
          pip install pyinstaller -r services/ai/requirements-dev.txt
          python -m unittest discover -s services/ai -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { throw "Sidecar regression tests failed" }
          powershell -ExecutionPolicy Bypass -File scripts/build-sidecar.ps1 -Python python
          if (Test-Path "release/ai-sidecar/.env") { throw "Refusing to package services/ai/.env into a release" }

      - name: Build and publish NSIS installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish always

      - name: Set release title and notes
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const tag = context.ref.replace('refs/tags/', '');
            const notesPath = `docs/RELEASE-NOTES-${tag}.md`;
            const body = fs.readFileSync(notesPath, 'utf8');
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
            });
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              name: `ClientHub ${tag}`,
              body,
            });

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: clienthub-setup
          path: release/*.exe
